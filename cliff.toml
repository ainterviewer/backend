# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Keep this file byte-identical across the ainterviewer repos. Section headings
# are a contract: deploy/scripts/generate_manifest.py parses them out of the
# published GitHub Release bodies.

[changelog]
header = """
# Changelog

Generated from [Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org). Releases older than the earliest entry below
predate this changelog — see `git log` for their history.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### Breaking Changes
{% for commit in breaking %}
- {% if commit.scope %}({{ commit.scope }}) {% endif %}\
{{ commit.breaking_description | default(value=commit.message) | upper_first }}
{%- endfor %}
{% endif %}
{%- for group, group_commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in group_commits %}
- {% if commit.scope %}({{ commit.scope }}) {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} [**breaking**]{% endif %}
{%- endfor %}
{% endfor %}\n"""
footer = ""
trim = false
# Collapse the trailing blank lines the body template leaves behind.
postprocessors = [{ pattern = '\n+$', replace = "\n" }]

[git]
conventional_commits = true
# Keep non-conforming commits out of the changelog rather than failing the build —
# the commit-msg hook is what enforces the convention.
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
split_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

commit_parsers = [
  # Release commits describe the release, not a change in it.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Release v", skip = true },

  # User-visible. deploy/scripts/generate_manifest.py lifts these three sections
  # (plus Breaking Changes) into the platform manifest.
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },

  # Repo-facing only.
  { message = "^refactor", group = "<!-- 4 -->Internal" },
  { message = "^docs", group = "<!-- 4 -->Internal" },
  { message = "^test", group = "<!-- 4 -->Internal" },
  { message = "^build", group = "<!-- 4 -->Internal" },
  { message = "^ci", group = "<!-- 4 -->Internal" },
  { message = "^style", group = "<!-- 4 -->Internal" },
  { message = "^chore", group = "<!-- 4 -->Internal" },
  { message = "^revert", group = "<!-- 4 -->Internal" },
]
