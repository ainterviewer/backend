name: release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - run: echo "${{ secrets.AINTERVIEWER_GITHUB_TOKEN }}" | gh auth login --with-token
      - run: gh auth setup-git
      - run: gh auth status

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Run pre-commit hooks
        run: uv run prek run --all-files

      # - run: uv run pytest -q

      - name: Minimize uv cache
        run: uv cache prune --ci

  docker:
    # Tag pushes publish a release; a manual run from a branch publishes a
    # staging preview of that branch. The tag list below decides which sticky
    # tags each case is allowed to move.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    name: Docker Build & Publish

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # 1. NEW: Generate Docker tags and metadata automatically
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with the git tag 
            type=ref,event=tag
            # 'latest' is the tag prod follows, so it moves only for a real,
            # non-pre-release version tag. The ref check carries the weight: a
            # branch name contains no 'rc', so the pre-release guard on its own
            # would happily publish a feature branch straight to prod.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc') }}
            # Staging follows every release, release candidates included, so a
            # candidate can be exercised there without moving the tag prod
            # follows. A manual run from a feature branch moves it too: that is
            # how a branch is previewed on staging without spending a version
            # number or publishing a GitHub Release.
            type=raw,value=staging
            # A branch build is the one case with no version tag to identify it,
            # so stamp the commit for "what is staging actually running?".
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Use the tags/labels generated by the metadata step
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          secrets: |
            github_token=${{ secrets.AINTERVIEWER_GITHUB_TOKEN }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docker]
    name: GitHub Release

    permissions:
      contents: write

    steps:
      # Full history + tags: git-cliff diffs this tag against the previous one.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          args: --latest --strip header

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.cliff.outputs.changelog }}
          prerelease: ${{ contains(github.ref, 'rc') }}
