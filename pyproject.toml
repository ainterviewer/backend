[project]
name = "ainterviewer-backend"
version = "0.10.12"
description = "AInterviewer backend API and services used to setup and conduct automated interviews at scale."
readme = "README.md"
authors = [{ name = "Tobias Gårdhus", email = "tpg@sodas.ku.dk" }]
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license_files = ["LICENSE"]

dependencies = [
  "adbc-driver-postgresql>=1.6.0",
  "ainterviewer",
  "aiofiles>=25.1.0",
  "aiohttp>=3.13.5",
  "aiosmtplib>=4.0.1",
  "alembic>=1.16.1",
  "bcrypt==4.3.0",
  "css-inline>=0.15.0",
  "fastapi[standard]>=0.159",
  "html2text>=2025.4.15",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "numpy>=2.3.5",
  "passlib[bcrypt]>=1.7.4",
  "polars>=2.0.0",
  "pyarrow>=20.0.0",
  "pycrdt>=0.14.8",
  "pycrdt-websocket>=0.16.5",
  "pydantic-ai-slim>=2.59.0,<3",
  "pydantic-extra-types>=2.10.4",
  "pydantic-settings>=2.7.1",
  "pydantic>=2.9,<3",
  "python-docx>=1.2.0",
  "python-jose[cryptography]>=3.5.0",
  "qrcode[pil]>=8.2",
  "scikit-learn>=1.3",
  "semver>=3.0.4",
  "sqlalchemy>=2.1.6",
  "sqliteai-vector>=0.9.52",
  "typer>=0.20.0",
  "umap-learn>=0.5.12",
  "uvicorn[standard]>=0.34.3",
  "weasyprint>=70.0",
  "websockets>=16.0",
  "xlsxwriter>=3.2.3",
]

[project.optional-dependencies]
analysis = [
  "adbc-driver-sqlite>=1.6.0",
  "sentence-transformers>=4.1.0",
  "ua-parser[regex]>=1.0.1",
  "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
  "deptry>=0.23.0",
  "djlint>=1.36.4",
  "inquirer>=3.4.0",
  "ipykernel>=6.29.5",
  "locust-plugins[websocket]>=4.7.0",
  "locust>=2.37.7",
  "nbstripout>=0.8.1",
  "playwright>=1.52.0",
  "pre-commit>=4.2.0",
  "prek>=0.3.10",
  "psycopg2-binary>=2.9.10",
  "pytest>=8.4.0",
  "ruff>=0.17.1",
  "ty>=0.0.90",
]

[tool.uv.sources]
ainterviewer = { git = "https://github.com/ainterviewer/lib.git", tag = "v0.7.2" }
# ainterviewer = { git = "https://github.com/ainterviewer/lib.git", rev = "25107e27f6ff8bce0fadd63d9841172e1815e427" }
# ainterviewer = { path = "../lib", editable = true }

[tool.locust]
locustfile = "scripts/locust_file.py"
host = "http://localhost:8666"

[tool.djlint]
profile = "jinja"
indent = 4

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  # Broad `except Exception` is deliberate in the embedding worker, the
  # websocket teardown paths and the load-test scripts: those must keep the
  # process alive and log, not propagate.
  "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies a mutable default per instance. Ruff can only tell a model
# by a `BaseModel` base it sees in the same file, and these inherit `Schema`.
"app/schemas/*" = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI, Typer and pydantic all express defaults as calls in the signature.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
  "pydantic.Field",
  "typer.Argument",
  "typer.Option",
]

[tool.ruff.lint.isort]
known-first-party = ["ainterviewer"]
known-third-party = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
